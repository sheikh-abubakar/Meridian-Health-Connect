name: Deploy Meridian backend to AWS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: meridian-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
      MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
      JWT_SECRET: ci-only-secret-never-used-in-production-2026
      GROQ_API_KEY: ci-placeholder-not-used-by-acceptance-tests
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate backend syntax
        run: npm run check

      - name: Run isolated acceptance tests
        if: env.TEST_MONGODB_URI != ''
        run: npm test

      - name: Configure SSH
        working-directory: .
        env:
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_KNOWN_HOSTS: ${{ secrets.AWS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" > ~/.ssh/meridian_deploy_key
          chmod 600 ~/.ssh/meridian_deploy_key
          printf '%s\n' "$AWS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate and prepare remote directory
        working-directory: .
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          case "$AWS_APP_DIR" in
            ""|/|/home|/var|/var/www) echo "Unsafe AWS_APP_DIR"; exit 1 ;;
          esac
          ssh -i ~/.ssh/meridian_deploy_key "$AWS_USER@$AWS_HOST" "mkdir -p '$AWS_APP_DIR'"

      - name: Synchronize backend source
        working-directory: .
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='coverage' \
            -e "ssh -i ~/.ssh/meridian_deploy_key" \
            backend/ "$AWS_USER@$AWS_HOST:$AWS_APP_DIR/"

      - name: Install production dependencies and reload API
        working-directory: .
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          ssh -i ~/.ssh/meridian_deploy_key "$AWS_USER@$AWS_HOST" "cd '$AWS_APP_DIR' && npm ci --omit=dev && (pm2 reload meridian-api --update-env || pm2 start src/server.js --name meridian-api) && pm2 save"

      - name: Verify public health endpoint
        working-directory: .
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 "$BACKEND_HEALTH_URL"
